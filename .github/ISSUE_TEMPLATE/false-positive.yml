name: False positive
description: Report an indicator that blocks something legitimate
title: "False positive: <indicator>"
labels: ["false-positive"]
body:
  - type: markdown
    attributes:
      value: False-positive reports are handled first.
  - type: input
    id: indicator
    attributes:
      label: Indicator
      placeholder: "e.g. 203.0.113.10"
    validations:
      required: true
  - type: input
    id: threat
    attributes:
      label: Threat folder
      placeholder: "e.g. threats/2026-11_November-2026/2026-11-09_MSP-Process-GDAP-Breach-Entra-Token-Abuse"
  - type: textarea
    id: impact
    attributes:
      label: What did it block?
      description: The legitimate service, site or file affected
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Why it is benign
      description: Ownership records, vendor documentation or other evidence
    validations:
      required: true
