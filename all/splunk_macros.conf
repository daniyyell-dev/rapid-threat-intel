# rapid-threat-intel: Splunk search macros for hunt_raw.spl (data not mapped to CIM)
# Field names follow CIM/UDM conventions and have not been tested against live data; adjust them to your environment.
# https://github.com/daniyyell-dev/rapid-threat-intel
#
# Install: Settings > Advanced search > Search macros > New, one per stanza below (name with "(1)", argument "terms"),
# or copy this file to $SPLUNK_HOME/etc/apps/<your_app>/local/macros.conf and restart or reload.
#
# Each macro must:
#   1. Start with your index and sourcetype constraints, then ($terms$), the raw-term pre-filter the hunt passes in.
#   2. Use only streaming commands (eval, rename, rex, spath, fields, search), because the hunt runs them inside multisearch.
#   3. Output the field names listed for it, using coalesce() to map your own names. Field names are case-sensitive in
#      Splunk, which is why Timestamp and timestamp, or RemoteIP and remote_ip, are both listed.
#
# _time: Splunk filters on the indexed _time, so set TIME_PREFIX and TIME_FORMAT in props.conf if your events carry
# their own Timestamp. The eval below only fixes the displayed time; it falls back to _time if parsing fails.

[rti_network(1)]
args = terms
# Output: src_ip, dest_ip, dest_port, action, user, dvc
definition = (index=firewall OR index=network) ($terms$) \
| eval src_ip=coalesce(src_ip, SourceIP, SrcIP, src, srcip, LocalIP, client_ip), dest_ip=coalesce(dest_ip, DestinationIP, DstIP, dest, dstip, RemoteIP, server_ip), dest_port=coalesce(dest_port, DestinationPort, dport, dstport, RemotePort), action=coalesce(action, Action, ActionType, disposition), user=coalesce(user, User, AccountName, src_user, username), dvc=coalesce(dvc, DeviceName, device_name, host) \
| eval _time=coalesce(strptime(coalesce(Timestamp, timestamp, TimeGenerated, event_time), "%Y-%m-%dT%H:%M:%S"), _time)
iseval = 0

[rti_dns(1)]
args = terms
# Output: src, dest, query, answer, user
definition = (index=dns OR index=network) ($terms$) \
| eval src=coalesce(src, src_ip, client_ip, ClientIP, SourceIP), dest=coalesce(dest, dest_ip, server_ip), query=lower(rtrim(coalesce(query, QueryName, query_name, DnsQueryString, qname, domain), ".")), answer=coalesce(answer, answers, IPAddresses, rdata), user=coalesce(user, User, AccountName) \
| eval _time=coalesce(strptime(coalesce(Timestamp, timestamp, TimeGenerated, event_time), "%Y-%m-%dT%H:%M:%S"), _time)
iseval = 0

[rti_web(1)]
args = terms
# Output: src, user, dest, url, http_user_agent, status, cookie
definition = (index=proxy OR index=web) ($terms$) \
| eval src=coalesce(src, src_ip, c_ip, ClientIP, client_ip), user=coalesce(user, cs_username, User, username), dest=lower(coalesce(dest, dest_host, cs_host, site, url_domain, RemoteUrl, hostname)), url=coalesce(url, uri, request_url, RequestURL, RemoteUrl, cs_uri), http_user_agent=coalesce(http_user_agent, user_agent, cs_User_Agent, UserAgent), status=coalesce(status, sc_status, http_status, StatusCode), cookie=coalesce(cookie, cs_Cookie, cs_cookie, http_cookie, Cookie) \
| eval _time=coalesce(strptime(coalesce(Timestamp, timestamp, TimeGenerated, event_time), "%Y-%m-%dT%H:%M:%S"), _time)
iseval = 0

[rti_endpoint(1)]
args = terms
# Output: dest, user, process, process_name, process_path, parent_process_name, process_hash, parent_process_hash, file_path, file_name, file_hash
# Hash fields may hold one digest or a list such as "SHA256=...,MD5=..."; the hunt matches the digest anywhere in the value.
# process_name and parent_process_name may be a bare name or a full path; the behaviour sections match either.
definition = (index=edr OR index=sysmon OR index=wineventlog) ($terms$) \
| eval dest=coalesce(dest, DeviceName, ComputerName, Computer, hostname, host), user=coalesce(user, AccountName, User, UserName, username), process=coalesce(process, ProcessCommandLine, CommandLine, cmdline, Image), process_name=coalesce(process_name, FileName, ProcessName, exe, comm, Image), process_path=coalesce(process_path, FolderPath, Image, exe), parent_process_name=coalesce(parent_process_name, InitiatingProcessFileName, ParentImage, ParentProcessName, parent_process), process_hash=coalesce(process_hash, SHA256, sha256, Hashes, hashes, SHA1, sha1, MD5, md5), parent_process_hash=coalesce(parent_process_hash, InitiatingProcessSHA256, ParentHashes, parent_sha256), file_path=coalesce(file_path, FolderPath, TargetFilename, path, file_name, FileName), file_name=coalesce(file_name, FileName, TargetFilename), file_hash=coalesce(file_hash, SHA256, sha256, Hashes, hashes, SHA1, sha1, MD5, md5) \
| eval _time=coalesce(strptime(coalesce(Timestamp, timestamp, TimeGenerated, event_time), "%Y-%m-%dT%H:%M:%S"), _time)
iseval = 0
